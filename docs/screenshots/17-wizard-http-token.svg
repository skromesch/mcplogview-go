<svg xmlns="http://www.w3.org/2000/svg" width="977" height="254" viewBox="0 0 977 254" role="img" aria-label="mcplogview configure">
<style>text{font-family:SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}</style>
<rect width="977" height="254" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h957a10 10 0 0 1 10 10v28H0z" fill="#161b22"/>
<circle cx="18" cy="19" r="6" fill="#ff5f56"/>
<circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="19" r="6" fill="#27c93f"/>
<text x="488" y="24" text-anchor="middle" fill="#8b949e" style="font-size:13px">mcplogview configure</text>
<text x="18" y="69.0" xml:space="preserve" textLength="184.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">Current: mode:   stdio</tspan></text>
<text x="18" y="87.0" xml:space="preserve" textLength="596.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">        (each agent starts its own mcplogview process; no network port)</tspan></text>
<text x="18" y="105.0" xml:space="preserve" textLength="344.4" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5f5fd7" font-weight="bold">Protect the HTTP endpoint with a token?</tspan></text>
<text x="18" y="123.0" xml:space="preserve" textLength="940.8" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9"> Clients send it as 'Authorization: Bearer &lt;token&gt;'. Plain HTTP is unencrypted: use a trusted network, an SSH t</tspan></text>
<text x="18" y="141.0" xml:space="preserve" textLength="176.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">unnel or a TLS proxy.</tspan></text>
<text x="18" y="159.0" xml:space="preserve" textLength="285.6" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff87d7">&gt; </tspan><tspan fill="#00af87">Generate a token (recommended)</tspan></text>
<text x="18" y="177.0" xml:space="preserve" textLength="520.8" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#d0d0d0">No token (anyone who can reach the port can read the logs)</tspan></text>
<text x="18" y="195.0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan></text>
<text x="18" y="231.0" xml:space="preserve" textLength="327.6" lengthAdjust="spacing"><tspan fill="#626262">↑</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#4e4e4e">up</tspan><tspan fill="#3a3a3a"> • </tspan><tspan fill="#626262">↓</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#4e4e4e">down</tspan><tspan fill="#3a3a3a"> • </tspan><tspan fill="#626262">/</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#4e4e4e">filter</tspan><tspan fill="#3a3a3a"> • </tspan><tspan fill="#626262">enter</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#4e4e4e">submit</tspan></text>
</svg>
