<svg xmlns="http://www.w3.org/2000/svg" width="977" height="488" viewBox="0 0 977 488" role="img" aria-label="mcplogview configure">
<style>text{font-family:SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}</style>
<rect width="977" height="488" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h957a10 10 0 0 1 10 10v28H0z" fill="#161b22"/>
<circle cx="18" cy="19" r="6" fill="#ff5f56"/>
<circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="19" r="6" fill="#27c93f"/>
<text x="488" y="24" text-anchor="middle" fill="#8b949e" style="font-size:13px">mcplogview configure</text>
<text x="18" y="69.0" xml:space="preserve" textLength="386.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">✓ saved to /home/dev/work/shop/mcplogview.json</tspan></text>
<text x="18" y="87.0" xml:space="preserve" textLength="100.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">mode:   http</tspan></text>
<text x="18" y="105.0" xml:space="preserve" textLength="201.6" lengthAdjust="spacing"><tspan fill="#c9d1d9">listen: 0.0.0.0:3333/mcp</tspan></text>
<text x="18" y="123.0" xml:space="preserve" textLength="336.0" lengthAdjust="spacing"><tspan fill="#c9d1d9">token:  OYJFpelBPNTZxkcETdPXBSBEyqGDX2P6</tspan></text>
<text x="18" y="159.0" xml:space="preserve" textLength="680.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">A running server needs a restart for this to apply (the token is picked up live).</tspan></text>
<text x="18" y="195.0" xml:space="preserve" textLength="646.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">This server runs over HTTP: start it once (e.g. in tmux or as a service) with</tspan></text>
<text x="18" y="231.0" xml:space="preserve" textLength="151.2" lengthAdjust="spacing"><tspan fill="#c9d1d9">  mcplogview serve</tspan></text>
<text x="18" y="267.0" xml:space="preserve" textLength="100.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">Claude Code:</tspan></text>
<text x="18" y="303.0" xml:space="preserve" textLength="940.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">  claude mcp add --transport http mcplogview http://shop-host.example.com:3333/mcp --header 'Authorization: Bear</tspan></text>
<text x="18" y="321.0" xml:space="preserve" textLength="302.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">er OYJFpelBPNTZxkcETdPXBSBEyqGDX2P6'</tspan></text>
<text x="18" y="357.0" xml:space="preserve" textLength="504.0" lengthAdjust="spacing"><tspan fill="#c9d1d9">Other MCP clients (the exact JSON shape differs per client):</tspan></text>
<text x="18" y="393.0" xml:space="preserve" textLength="932.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">  "mcplogview": { "type": "http", "url": "http://shop-host.example.com:3333/mcp", "headers": { "Authorization":</tspan></text>
<text x="18" y="411.0" xml:space="preserve" textLength="378.0" lengthAdjust="spacing"><tspan fill="#c9d1d9">"Bearer OYJFpelBPNTZxkcETdPXBSBEyqGDX2P6" } }</tspan></text>
<text x="18" y="447.0" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#c9d1d9">Note: plain HTTP sends the token unencrypted. Use it only on a trusted network,</tspan></text>
<text x="18" y="465.0" xml:space="preserve" textLength="546.0" lengthAdjust="spacing"><tspan fill="#c9d1d9">through an SSH tunnel, or behind a TLS-terminating reverse proxy.</tspan></text>
</svg>
