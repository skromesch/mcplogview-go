<text x="18" y="105.0" xml:space="preserve" textLength="235.2" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5f5fd7" font-weight="bold">How should agents connect?</tspan></text>
<text x="18" y="123.0" xml:space="preserve" textLength="546.0" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff87d7">&gt; </tspan><tspan fill="#00af87">stdio: each agent starts its own mcplogview (no network port)</tspan></text>
<text x="18" y="141.0" xml:space="preserve" textLength="445.2" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#d0d0d0">HTTP: one central instance that agents connect to</tspan></text>
<text x="18" y="159.0" xml:space="preserve" textLength="495.6" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#d0d0d0">HTTPS with a self-signed certificate (development only)</tspan></text>
<text x="18" y="177.0" xml:space="preserve" textLength="151.2" lengthAdjust="spacing"><tspan fill="#444444">┃</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#d0d0d0">« back to menu</tspan></text>
