version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/mcplogview
    binary: mcplogview
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/skromesch/mcplogview-go/internal/buildinfo.Version={{.Version}}
      - -X github.com/skromesch/mcplogview-go/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/skromesch/mcplogview-go/internal/buildinfo.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: mcplogview
    repository:
      owner: skromesch
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/skromesch/mcplogview-go"
    description: "MCP server exposing local and SSH log files to AI agents"
    binaries:
      - mcplogview
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mcplogview"]
          end

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
